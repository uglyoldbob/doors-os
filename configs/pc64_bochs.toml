kernel_machine = "x86_64-unknown-none"

[kernel_config]
machine_name = "pc64"
acpi = true
gdbstub = true
mm_debug = false
test = true

[disk.unique.Cd]
kernel_path = "./build/iso/boot/kernel"

[disk.common]
output = "cd64.iso"
disk_label = "Doors OS"
config_files = [[
    "./build/iso/boot/grub/grub.cfg",
    """
set timeout=1
set default=0 # Set the default menu entry
 
menuentry "Doors OS" {
   multiboot2 /boot/kernel testing
   boot
}""",
]]

[target.config]
net_devs = [0]

[target.emulator.Bochs]