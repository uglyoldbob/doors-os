[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "link-arg=-no-pie",
    "-C", "force-frame-pointers",
    "-C", "force-unwind-tables",
    "-C", "debuginfo=2",
    "-Z", "emit-stack-sizes",
]

[target.i486-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "link-arg=-no-pie",
    "-C", "force-frame-pointers",
    "-C", "force-unwind-tables",
    "-C", "debuginfo=2",
    "-Z", "emit-stack-sizes",
]

[target.thumbv7em-none-eabihf]
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "link-arg=-no-pie",
    "-C", "debuginfo=2",
]
runner = 'probe-rs run --chip stm32f769iitx'

[unstable]
build-std = ["core", "alloc"]

[build]
rustflags = [
    "-C", "debuginfo=2",
    "-Z", "location-detail=line,file,column",
]
