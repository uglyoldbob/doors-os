[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=pic", 
    "-C", "link-arg=-no-pie",
    "-C", "force-frame-pointers",
    "-Z", "emit-stack-sizes",]

[target.i386-unknown-none]
linker = "rust-lld"
rustflags = ["-C", "relocation-model=pic", 
    "-C", "link-arg=-no-pie",
    "-C", "force-frame-pointers",
    "-Z", "emit-stack-sizes",]

[target.thumbv7em-none-eabihf]
rustflags = ["-C", "relocation-model=pic", 
    "-C", "link-arg=-no-pie"]
runner = 'probe-rs run --chip stm32f769iitx'

[unstable]
build-std = ["core", "alloc"]